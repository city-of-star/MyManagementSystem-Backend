# 端口配置
server:
  port: 5091

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://YOUR_DB_HOST:3306/mms_dev_core?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&rewriteBatchedStatements=true
  servlet:
    multipart:
      # Multipart 上传限制（需要 >= file.upload.max-size，否则请求在进入 Controller 前就会被拦截）
      max-file-size: 50MB
      max-request-size: 50MB

# Swagger 配置
springdoc:
  swagger-ui:
    url: /base/v3/api-docs

# MySQL 备份推送 Git（生产请在 Nacos base-PROD.yaml 填写真实 token，勿提交到仓库）
mms:
  backup:
    enabled: false
    repo-url: https://github.com/city-of-star/mms-side-income-data-backup.git
    github-token: YOUR_GITHUB_PAT
    work-dir: /lhy/opt/mysql/backup
    backup-dir: backups
    # 为空则从 spring.datasource.url 解析库名；生产可显式指定
    database: mms_side_income_prod_core
    retain-days: 30
    mysqldump-path: mysqldump
    git-path: git
    branch: main
    git-user-name: mms-backup
    git-user-email: mms-backup@localhost

# 文件上传配置
file:
  upload:
    # 允许的文件类型（扩展名，小写）
    allowed-types:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - pdf
      - txt
      - md
    # 单个文件最大大小（MB）
    max-size: 50
    # 存储路径（相对路径）
    storage-path: ./attachments
    # 访问URL前缀
    url-prefix:  /api/base/attachment/stream
    # 批量上传最大文件数量
    max-batch-count: 10